<!DOCTYPE html>
<html>
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>GitHub User Activity</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div class="container">
        <h1>GitHub Activity Viewer</h1>

        <div class="search-box">
            <input type="text" id="username" placeholder="Username or paste a GitHub link...">
            <button onclick="getActivity()">Search</button>
        </div>
        <p class="hint">Paste a profile, repo, issue, or pull request link for a detailed breakdown.</p>
        
        <div id="output"></div>
    </div>
    <script src="script.js"></script>
</body>
</html>
