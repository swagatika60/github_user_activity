<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>GitHub Activity Viewer</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div class="app">
        <header class="app-header">
            <div class="brand">
                <div class="brand-icon" aria-hidden="true">
                    <svg viewBox="0 0 24 24" fill="currentColor"><path d="M12 0C5.37 0 0 5.37 0 12c0 5.31 3.435 9.795 8.205 11.385.6.105.825-.255.825-.57 0-.285-.015-1.23-.015-2.235-3.015.555-3.795-.735-4.035-1.41-.135-.345-.72-1.41-1.23-1.695-.42-.225-1.02-.78-.015-.795.945-.015 1.62.87 1.845 1.23 1.08 1.815 2.805 1.305 3.495.99.105-.78.42-1.305.765-1.605-2.67-.3-5.46-1.335-5.46-5.925 0-1.305.465-2.385 1.23-3.225-.12-.3-.54-1.53.12-3.18 0 0 1.005-.315 3.3 1.23.96-.27 1.98-.405 3-.405s2.04.135 3 .405c2.295-1.56 3.3-1.23 3.3-1.23.66 1.65.24 2.88.12 3.18.765.84 1.23 1.905 1.23 3.225 0 4.605-2.805 5.625-5.475 5.925.435.375.81 1.095.81 2.22 0 1.605-.015 2.895-.015 3.3 0 .315.225.69.825.57A12.02 12.02 0 0024 12c0-6.63-5.37-12-12-12z"/></svg>
                </div>
                <div>
                    <h1>GitHub Activity Viewer</h1>
                    <p class="subtitle">Explore profiles, repos, issues, PRs &amp; commits</p>
                </div>
            </div>
            <div class="header-actions">
                <div class="status-pill" id="api-status" title="Backend connection status">
                    <span class="status-dot"></span>
                    <span class="status-text">Connecting...</span>
                </div>
                <div class="auth-area" id="auth-area">
                    <button type="button" class="auth-btn" id="open-auth">Sign in</button>
                </div>
            </div>
        </header>

        <div class="auth-modal" id="auth-modal" hidden>
            <div class="auth-modal-backdrop" id="auth-backdrop"></div>
            <div class="auth-modal-card" role="dialog" aria-labelledby="auth-title">
                <button type="button" class="modal-close" id="close-auth" aria-label="Close">&times;</button>
                <h2 id="auth-title">Welcome back</h2>
                <p class="auth-subtitle" id="auth-subtitle">Sign in to save search history across devices.</p>

                <button type="button" class="github-btn" id="github-oauth-btn">
                    <svg viewBox="0 0 16 16" fill="currentColor" aria-hidden="true"><path d="M8 0C3.58 0 0 3.58 0 8c0 3.54 2.29 6.53 5.47 7.59.4.07.55-.17.55-.38 0-.19-.01-.82-.01-1.49-2.01.37-2.53-.49-2.69-.94-.09-.23-.48-.94-.82-1.13-.28-.15-.68-.52-.01-.53.63-.01 1.08.58 1.23.82.72 1.21 1.87.87 2.33.66.07-.52.28-.87.51-1.07-1.78-.2-3.64-.89-3.64-3.95 0-.87.31-1.59.82-2.15-.08-.2-.36-1.02.08-2.12 0 0 .67-.21 2.2.82.64-.18 1.32-.27 2-.27s1.36.09 2 .27c1.53-1.04 2.2-.82 2.2-.82.44 1.1.16 1.92.08 2.12.51.56.82 1.27.82 2.15 0 3.07-1.87 3.75-3.65 3.95.29.25.54.73.54 1.48 0 1.07-.01 1.93-.01 2.2 0 .21.15.46.55.38A8.01 8.01 0 0016 8c0-4.42-3.58-8-8-8z"/></svg>
                    Continue with GitHub
                </button>
                <div class="auth-divider"><span>or</span></div>
                <p class="auth-error" id="github-oauth-error" hidden></p>

                <div class="auth-tabs">
                    <button type="button" class="auth-tab active" data-tab="login">Sign in</button>
                    <button type="button" class="auth-tab" data-tab="register">Create account</button>
                </div>

                <form id="login-form" class="auth-form">
                    <label for="login-email">Email</label>
                    <input type="email" id="login-email" required autocomplete="email">
                    <label for="login-password">Password</label>
                    <input type="password" id="login-password" required autocomplete="current-password">
                    <button type="submit" class="submit-btn">Sign in</button>
                    <p class="auth-error" id="login-error" hidden></p>
                </form>

                <form id="register-form" class="auth-form" hidden>
                    <label for="register-name">Name</label>
                    <input type="text" id="register-name" required autocomplete="name">
                    <label for="register-email">Email</label>
                    <input type="email" id="register-email" required autocomplete="email">
                    <label for="register-password">Password</label>
                    <input type="password" id="register-password" required minlength="6" autocomplete="new-password">
                    <button type="submit" class="submit-btn">Create account</button>
                    <p class="auth-error" id="register-error" hidden></p>
                </form>
            </div>
        </div>

        <main class="main-card">
            <section class="search-section">
                <label for="username" class="search-label">Search GitHub</label>
                <div class="search-box">
                    <input type="text" id="username" placeholder="Username or paste any GitHub link..." autocomplete="off">
                    <button type="button" id="search-btn">Search</button>
                </div>
                <div class="feature-chips">
                    <span class="chip">Profiles</span>
                    <span class="chip">Repositories</span>
                    <span class="chip">Issues</span>
                    <span class="chip">Pull Requests</span>
                    <span class="chip">Commits</span>
                </div>
            </section>

            <section class="history-section" id="history-section" hidden>
                <div class="history-header">
                    <h2>Recent searches</h2>
                    <button type="button" class="text-btn" id="clear-history">Clear</button>
                </div>
                <div class="history-list" id="history-list"></div>
            </section>

            <section class="history-section" id="github-section" hidden>
                <div class="history-header">
                    <h2>Your GitHub account</h2>
                </div>
                <div class="github-account" id="github-account-output"></div>
            </section>

            <section id="output" class="output-section"></section>
        </main>

        <footer class="app-footer">
            <span>Powered by GitHub REST API</span>
            <span id="rate-limit-info"></span>
        </footer>
    </div>
    <script src="script.js"></script>
</body>
</html>
